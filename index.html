toastTimeout = setTimeout(function(){toast.classList.remove('show')}, 2500);
}

function copyToClipboard(text, successMessage){
var done = function(){showToast(successMessage)};
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(done).catch(fallback);
}else{
fallback();
}
function fallback(){
var temp = document.createElement('textarea');
temp.value = text;
temp.style.position = 'fixed';
temp.style.opacity = '0';
document.body.appendChild(temp);
temp.select();
try{document.execCommand('copy')}catch(e){}
document.body.removeChild(temp);
done();
}
}

function formatPrice(price){return price + ' ₽'}

function renderProducts(){
var filtered = currentCategory === 'all' ? products : products.filter(function(p){return p.category === currentCategory});
var html = '';
for(var i = 0; i < filtered.length; i++){
var p = filtered[i];
var badgeHtml = '';
if(p.badge === 'sale'){badgeHtml = '<span class="badge sale">SALE%</span>'}
else if(p.badge === 'discount'){badgeHtml = '<span class="badge discount">СКИДКА</span>'}
html += '<div class="product-card" data-category="' + p.category + '">' + badgeHtml +
'<div class="product-icon">' + p.icon + '</div>' +
'<div class="product-name">' + p.name + '</div>' +
'<div class="product-bonus">' + (p.bonus || '&nbsp;') + '</div>' +
'<div class="product-price">' + formatPrice(p.price) + '</div>' +
'<button class="buy-btn" data-product-id="' + p.id + '">Купить</button></div>';
}
productsGrid.innerHTML = html;

var btns = productsGrid.querySelectorAll('.buy-btn');
for(var j = 0; j < btns.length; j++){
btns[j].addEventListener('click', function(e){
var productId = parseInt(e.currentTarget.getAttribute('data-product-id'), 10);
var product = null;
for(var k = 0; k < products.length; k++){
if(products[k].id === productId){product = products[k]; break}
}
if(product){openPaymentModal(product)}
});
}
}

function updateRiliksPrice(amount){
var val = parseInt(amount, 10);
if(isNaN(val)){val = 50}
val = Math.max(50, Math.min(10000, val));
riliksAmount = val;
var price = val / 10;
riliksPriceDisplay.textContent = formatPrice(price);
riliksSlider.value = val;
riliksInput.value = val;
}

function openRulesModal(){rulesModal.classList.add('active')}
function closeRulesModal(){rulesModal.classList.remove('active')}

function getProductName(product){
return product.isRiliks === true ? riliksAmount + ' риликов' : product.name;
}

function openPaymentModal(product){
currentProduct = product;
var price = product.price;
var productName = getProductName(product);

paymentModalContent.innerHTML = '<button class="modal-close" id="closePaymentBtn">&times;</button>' +
'<h3>Оформление заказа</h3>' +
'<div class="order-product">' +
'<span class="name">' + productName + '</span>' +
'<span class="price">' + formatPrice(price) + '</span>' +
'</div>' +
'<div class="form-group">' +
'<label for="nicknameInput">Ваш игровой никнейм на CodexWorld *</label>' +
'<input type="text" id="nicknameInput" placeholder="Например: Steve" autocomplete="off" value="' + (orderState.nickname || '') + '">' +
'<div class="error-text" id="nicknameError">Укажите ник с сервера!</div>' +
'</div>' +
'<div class="form-group">' +
'<label for="promoInput">Промокод (если есть)</label>' +
'<input type="text" id="promoInput" placeholder="Введите промокод" value="' + (orderState.promo || '') + '">' +
'</div>' +
'<button class="payment-btn" id="goToPaymentBtn">Перейти к оплате</button>' +
'<div class="rules-link-small">Нажимая «Перейти к оплате», вы соглашаетесь с <a id="openRulesFromPayment">правилами покупки доната</a></div>';

paymentModal.classList.add('active');

document.getElementById('closePaymentBtn').addEventListener('click', closePaymentModal);
document.getElementById('openRulesFromPayment').addEventListener('click', function(e){
e.preventDefault();
closePaymentModal();
openRulesModal();
});
document.getElementById('goToPaymentBtn').addEventListener('click', handleGoToPayment);

setTimeout(function(){
var el = document.getElementById('nicknameInput');
if(el){el.focus()}
}, 100);
}

function closePaymentModal(){
paymentModal.classList.remove('active');
currentProduct = null;
}

function handleGoToPayment(){
var nicknameInput = document.getElementById('nicknameInput');
var promoInput = document.getElementById('promoInput');
var nickname = nicknameInput.value.trim();
var promo = promoInput.value.trim();
var nicknameError = document.getElementById('nicknameError');

if(!nickname){
nicknameInput.classList.add('error');
nicknameError.classList.add('visible');
nicknameInput.focus();
return;
}

nicknameInput.classList.remove('error');
nicknameError.classList.remove('visible');

orderState.nickname = nickname;
orderState.promo = promo;

showSbpScreen();
}

function showSbpScreen(){
var productName = getProductName(currentProduct);
var price = currentProduct.price;

paymentModalContent.innerHTML = '<button class="modal-close" id="closeSbpBtn">&times;</button>' +
'<h3>Оплата по СБП</h3>' +
'<div class="order-product">' +
'<span class="name">' + productName + '</span>' +
'<span class="price">' + formatPrice(price) + '</span>' +
'</div>' +
'<div style="background:#151b2b;border-radius:16px;padding:16px;margin-bottom:20px;font-size:0.9rem">' +
'<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--text-muted)">Игровой ник:</span><span style="font-weight:700">' + orderState.nickname + '</span></div>' +
'</div>' +
'<div class="sbp-sum">' +
'<div class="label">Сумма к переводу</div>' +
'<div class="amount">' + formatPrice(price) + '</div>' +
'</div>' +
'<div class="sbp-block">' +
'<div class="sbp-title">Реквизиты СБП</div>' +
'<div class="sbp-row">' +
'<span class="sbp-label">Номер телефона</span>' +
'<span class="sbp-value">' + SBP_PHONE_DISPLAY + ' <button class="copy-sbp-btn" id="copySbpBtn">📋 Скопировать</button></span>' +
'</div>' +
'<div class="sbp-row"><span class="sbp-label">Банк получателя</span><span class="sbp-value">' + SBP_BANK + '</span></div>' +
'<div class="sbp-row"><span class="sbp-label">Получатель</span><span class="sbp-value">' + SBP_RECIPIENT + '</span></div>' +
'</div>' +
'<div class="sbp-instruction">' +
'<strong>Важно!</strong> Переведите точную сумму по СБП на указанный номер и в комментарии к переводу обязательно напишите свой игровой ник: <strong>' + orderState.nickname + '</strong>.' +
'</div>' +
'<button class="paid-btn" id="paidBtn">Я оплатил</button>';

document.getElementById('closeSbpBtn').addEventListener('click', closePaymentModal);
document.getElementById('copySbpBtn').addEventListener('click', function(){
copyToClipboard(SBP_PHONE_RAW, 'Номер скопирован!');
});
document.getElementById('paidBtn').addEventListener('click', showTicketScreen);
}

function showTicketScreen(){
orderState.orderNumber = Math.floor(100000 + Math.random() * 900000);

var productName = getProductName(currentProduct);
var price = currentProduct.price;

paymentModalContent.innerHTML = '<button class="modal-close" id="closeTicketBtn">&times;</button>' +
'<div class="ticket-screen">' +
'<div class="ticket-icon">🧾</div>' +
'<h3 style="margin-bottom:8px">Заявка на выдачу доната</h3>' +
'<div class="ticket-number">#' + orderState.orderNumber + '</div>' +
'<div class="ticket-details">' +
'<div class="ticket-row"><span class="k">Сервер</span><span class="v">CodexWorld</span></div>' +
'<div class="ticket-row"><span class="k">Игровой ник</span><span class="v">' + orderState.nickname + '</span></div>' +
'<div class="ticket-row"><span class="k">Товар</span><span class="v">' + productName + '</span></div>' +
'<div class="ticket-row"><span class="k">Сумма</span><span class="v">' + formatPrice(price) + '</span></div>' +
'<div class="ticket-row"><span class="k">Статус</span><span class="v"><span class="ticket-status">Ожидает проверки платежа</span></span></div>' +
'</div>' +
'<div class="ticket-warning">' +
'<strong>Внимание!</strong> Донат выдаётся только после реального поступления денег. Отправьте скриншот перевода из банка администратору в ВК.' +
'</div>' +
'<button class="vk-btn" id="sendVkBtn">💬 Отправить чек из банка в ВК</button>' +
'</div>';

document.getElementById('closeTicketBtn').addEventListener('click', closePaymentModal);
document.getElementById('sendVkBtn').addEventListener('click', function(){
window.open(VK_URL, '_blank');
});
}

riliksSlider.addEventListener('input', function(e){
updateRiliksPrice(e.target.value);
});

riliksInput.addEventListener('input', function(e){
var raw = e.target.value;
if(raw === ''){return}
var val = parseInt(raw, 10);
if(isNaN(val)){return}
updateRiliksPrice(val);
});

riliksInput.addEventListener('blur', function(e){
var val = parseInt(e.target.value, 10);
if(isNaN(val)){val = 50}
updateRiliksPrice(val);
});

buyRiliksBtn.addEventListener('click', function(){
openPaymentModal({
id:999,
category:'riliks',
name:'Рилики',
bonus:'',
price:riliksAmount/10,
icon:'💎',
badge:null,
isRiliks:true
});
});

var catBtns = categoriesNav.querySelectorAll('.cat-btn');
for(var i = 0; i < catBtns.length; i++){
catBtns[i].addEventListener('click', function(e){
var btn = e.currentTarget;
var cat = btn.getAttribute('data-cat');
currentCategory = cat;

var all = categoriesNav.querySelectorAll('.cat-btn');
for(var k = 0; k < all.length; k++){all[k].classList.remove('active')}
btn.classList.add('active');

renderProducts();
});
}

copyIpBtn.addEventListener('click', function(){
copyToClipboard(SERVER_IP, 'IP скопирован!');
});

rulesBtn.addEventListener('click', function(e){
e.preventDefault();
openRulesModal();
});

closeRulesBtn.addEventListener('click', closeRulesModal);
agreeRulesBtn.addEventListener('click', closeRulesModal);

rulesModal.addEventListener('click', function(e){
if(e.target === rulesModal){closeRulesModal()}
});

paymentModal.addEventListener('click', function(e){
if(e.target === paymentModal){closePaymentModal()}
});

updateRiliksPrice(500);
renderProducts();

});
</script>
</body>
</html>
